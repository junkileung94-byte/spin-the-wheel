<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control — sign in</title>
    <link rel="icon" href="/assets/wheel.svg" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <style>
      body {
        display: grid;
        place-items: center;
      }
      form {
        width: min(92vw, 380px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(20, 16, 58, 0.7);
        border: 1px solid var(--k-line);
        border-radius: var(--k-radius-lg);
        padding: 28px;
        backdrop-filter: blur(10px);
        text-align: center;
      }
      .logo.big {
        width: 96px;
        height: 96px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <div class="logo big"></div>
      <div class="brandname neon-soft">Control panel</div>
      <div class="hint">Operator access. Find the token in your private <code>data/secrets.json</code> file, or use the CONTROL_TOKEN you configured. Keep it private.</div>
      <input type="password" name="token" placeholder="Control token" autofocus autocomplete="current-password" />
      <button class="btn primary" type="submit">Unlock</button>
      <div class="hint" id="bad" hidden style="color: #ff9aab">Wrong token.</div>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("bad")) document.getElementById("bad").hidden = false;
    </script>
  </body>
</html>
