<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control — sign in</title>
    <link rel="icon" href="/api/logo" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <style>
      body {
        display: grid;
        place-items: center;
      }
      form {
        width: min(92vw, 380px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(20, 16, 58, 0.7);
        border: 1px solid var(--k-line);
        border-radius: var(--k-radius-lg);
        padding: 28px;
        backdrop-filter: blur(10px);
        text-align: center;
      }
      .logo.big {
        width: 96px;
        height: 96px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <div class="logo big"></div>
      <div class="brandname neon-soft">Wheel dashboard</div>
      <div class="hint">
        Open the sign-in link you were given, or paste your dashboard code here. You stay signed in on this
        browser for a year.
      </div>
      <input type="password" name="token" placeholder="Dashboard code" aria-label="Dashboard code" autofocus autocomplete="current-password" />
      <button class="btn primary" type="submit">Open dashboard</button>
      <div class="hint" id="bad" hidden style="color: #ff9aab">That code didn’t work. Check it and try again.</div>
      <div class="hint">
        Running the wheel yourself? In the wheel’s folder run <code>npm run dashboard-link</code> to get a one-click
        sign-in link.
      </div>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("bad")) document.getElementById("bad").hidden = false;
    </script>
  </body>
</html>
